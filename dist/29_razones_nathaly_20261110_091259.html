  <title>29 razones para celebrar tu vida</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap">
  <style>
/*
 * 29 razones para celebrar tu vida
 * Concepto: una carta de papelería fina. Fondo marfil, sobre vino, tarjetas como
 * pequeñas piezas de imprenta numeradas. Serif editorial para títulos, sans ligera
 * para apoyo y caligrafía solo en saludos y firma.
 * Diseño de un solo tema (marfil) a propósito: los colores se fijan explícitamente.
 */
:root {
  color-scheme: light;

  /* Paleta oficial */
  --vino: #79113A;
  --frambuesa: #C62744;
  --rosa: #DB8192;
  --rosa-suave: #E7AAB7;
  --marfil: #E9E7DD;

  /* Derivados de la paleta */
  --vino-profundo: #5A0C2B;
  --vino-medio: #8C1A47;
  --papel: #F6F4EE;
  --tinta: #3E0A20;
  --tinta-suave: #6E3A4F;
  --linea: rgba(219, 129, 146, .55);

  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: "Jost", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mano: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;

  --ease: cubic-bezier(.22, .61, .36, 1);
  --ease-suave: cubic-bezier(.4, 0, .2, 1);
  --barra-alto: 64px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--marfil);
  color: var(--tinta);
  font-family: var(--sans);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.oculto {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px;
}

/* ---------- Estructura ---------- */
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
  background: var(--marfil);
}
.fondo {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 60% at 0% 0%, rgba(231, 170, 183, .38), transparent 55%),
    radial-gradient(90% 50% at 100% 100%, rgba(219, 129, 146, .22), transparent 60%);
}

/* ---------- Barra superior ---------- */
.barra {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 6px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.puntos { display: flex; justify-content: center; flex: 1; min-width: 0; }
.punto {
  width: 30px;
  height: 44px;
  padding: 0;
  border: 0;
  background: none;
  display: grid;
  place-items: center;
}
.punto::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid var(--rosa);
  transition: background .4s var(--ease), transform .4s var(--ease), width .4s var(--ease), border-radius .4s;
}
.punto.visitada::before { background: var(--rosa-suave); }
.punto[aria-current="step"]::before { width: 22px; border-radius: 4px; background: var(--vino); border-color: var(--vino); }
.punto:disabled { cursor: default; opacity: .5; }
.punto:focus-visible { outline: none; }
.punto:focus-visible::before { box-shadow: 0 0 0 3px var(--papel), 0 0 0 4.5px var(--frambuesa); }

.btn-icono {
  position: relative;
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--linea);
  background: rgba(246, 244, 238, .75);
  color: var(--vino);
  display: grid;
  place-items: center;
  padding: 0;
  transition: transform .25s var(--ease), opacity .25s, background .3s, color .3s;
}
.btn-icono:disabled { opacity: .3; cursor: default; }
.btn-icono:not(:disabled):active { transform: scale(.93); }
.btn-icono:focus-visible { outline: 2px solid var(--frambuesa); outline-offset: 2px; }
.btn-icono[aria-pressed="true"] { background: var(--vino); color: var(--marfil); border-color: var(--vino); }
.ondas {
  position: absolute;
  right: 7px;
  bottom: 8px;
  display: none;
  gap: 1.5px;
  align-items: flex-end;
  height: 8px;
}
.ondas i { width: 2px; height: 100%; background: currentColor; border-radius: 1px; animation: onda 1s ease-in-out infinite; }
.ondas i:nth-child(2) { animation-delay: -.3s; }
.ondas i:nth-child(3) { animation-delay: -.6s; }
.btn-icono[aria-pressed="true"] .ondas { display: flex; }
@keyframes onda { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

/* ---------- Escenas ---------- */
.escenario {
  position: relative;
  z-index: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--rosa-suave) transparent;
}
.escena {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-top: 8px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.escena.entrando { animation: entrar .7s var(--ease) both; }
.escena.saliendo { animation: salir .35s var(--ease-suave) both; }
@keyframes entrar { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes salir { to { opacity: 0; transform: translateY(-10px); } }

.contenido {
  width: 100%;
  max-width: 520px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.contenido.ancho { max-width: 760px; }
.contenido.centrado { align-items: center; text-align: center; }

/* ---------- Tipografía ---------- */
.eyebrow {
  margin: 0;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--frambuesa);
}
.titulo {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(32px, 9vw, 48px);
  line-height: 1.05;
  letter-spacing: -.01em;
  color: var(--vino);
  text-wrap: balance;
}
.subtitulo { margin: 0; color: var(--tinta-suave); font-size: 15px; max-width: 46ch; text-wrap: pretty; }
.cabecera { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.cabecera .subtitulo { margin-inline: auto; }
.manuscrito { font-family: var(--mano); font-weight: 400; color: var(--frambuesa); line-height: 1.15; margin: 0; }

/* ---------- Botones ---------- */
.btn-principal, .btn-secundario {
  min-height: 52px;
  padding: 14px 30px;
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  transition: transform .25s var(--ease), background .3s, box-shadow .3s, color .3s;
  touch-action: manipulation;
}
.btn-principal {
  border: 0;
  background: var(--frambuesa);
  color: #FFF8F6;
  box-shadow: 0 10px 24px -12px rgba(198, 39, 68, .8);
}
.btn-principal:hover { background: var(--vino); }
.btn-secundario { background: transparent; color: var(--vino); border: 1px solid var(--rosa); }
.btn-secundario:hover { background: rgba(231, 170, 183, .25); }
.btn-principal:active, .btn-secundario:active { transform: scale(.97); }
.btn-principal:focus-visible, .btn-secundario:focus-visible { outline: 2px solid var(--vino); outline-offset: 3px; }
.btn-principal.pulso { animation: pulso 2.8s var(--ease) infinite; }
@keyframes pulso {
  0%, 100% { box-shadow: 0 10px 24px -12px rgba(198, 39, 68, .8), 0 0 0 0 rgba(198, 39, 68, .25); }
  50% { box-shadow: 0 10px 24px -12px rgba(198, 39, 68, .8), 0 0 0 10px rgba(198, 39, 68, 0); }
}
.acciones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* ---------- Escena 01: sobre ---------- */
.nombre-portada {
  margin: -8px 0 0;
  font-family: var(--mano);
  font-weight: 400;
  font-size: clamp(64px, 19vw, 92px);
  line-height: 1;
  color: var(--vino);
}
.sobre {
  position: relative;
  width: min(300px, 78vw);
  aspect-ratio: 3 / 2;
  max-width: 100%;
  margin-top: 26px;
  padding: 0;
  border: 0;
  background: none;
  perspective: 1000px;
  -webkit-tap-highlight-color: transparent;
}
.sobre:focus-visible { outline: 2px solid var(--frambuesa); outline-offset: 8px; border-radius: 8px; }
.sobre > span { position: absolute; display: block; }
.sobre-fondo {
  inset: 0;
  border-radius: 6px;
  background: linear-gradient(180deg, var(--vino-profundo), var(--vino));
  box-shadow: 0 34px 50px -30px rgba(62, 10, 32, .75);
}
.sobre-carta {
  left: 7%;
  right: 7%;
  top: 7%;
  bottom: 6%;
  z-index: 2;
  border-radius: 3px;
  background: var(--papel);
  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 8%;
  transition: transform 1s var(--ease) .55s;
}
.sobre-carta-num { font-family: var(--serif); font-size: 44px; font-weight: 500; line-height: 1; color: var(--vino); }
.sobre-carta-txt { font-family: var(--mano); font-size: 26px; color: var(--frambuesa); line-height: 1; }
.sobre-bolsillo {
  inset: 0;
  z-index: 3;
  border-radius: 6px;
  background: linear-gradient(170deg, var(--vino-medio), var(--vino) 70%);
  clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
}
.sobre-bolsillo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top right, transparent calc(50% - .6px), rgba(0, 0, 0, .18) 50%, transparent calc(50% + .6px)) left bottom / 50% 100% no-repeat,
              linear-gradient(to top left, transparent calc(50% - .6px), rgba(0, 0, 0, .18) 50%, transparent calc(50% + .6px)) right bottom / 50% 100% no-repeat;
}
.sobre-solapa {
  left: 0;
  right: 0;
  top: 0;
  height: 60%;
  z-index: 4;
  background: linear-gradient(180deg, var(--vino-medio), #6C0F34);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border-radius: 6px 6px 0 0;
  transform-origin: 50% 0;
  transition: transform .8s var(--ease), z-index 0s linear .4s;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .2));
}
.sello {
  left: 50%;
  top: 60%;
  z-index: 5;
  width: 54px;
  height: 54px;
  margin: -27px 0 0 -27px;
  border-radius: 50%;
  display: grid !important;
  place-items: center;
  color: var(--rosa-suave);
  background: radial-gradient(circle at 35% 30%, #D8445E, var(--frambuesa) 55%, #A31D37);
  box-shadow: 0 3px 8px rgba(62, 10, 32, .4), inset 0 0 0 4px rgba(255, 255, 255, .08), inset 0 0 0 6px rgba(0, 0, 0, .08);
  transition: transform .5s var(--ease), opacity .4s;
}
.sobre:hover .sello { transform: scale(1.06); }
#escena-0 .eyebrow, .nombre-portada, .frase-sobre, #btn-abrir { transition: opacity .6s var(--ease), transform .6s var(--ease); }
.abriendo .eyebrow, .abriendo .nombre-portada { opacity: 0; transform: translateY(-12px); }
.abriendo .frase-sobre, .abriendo #btn-abrir { opacity: .35; }
.sobre.abierto .sello { transform: scale(.3); opacity: 0; }
.sobre.abierto .sobre-solapa { transform: rotateX(180deg); z-index: 1; }
.sobre.abierto .sobre-carta { transform: translateY(-48%); }

.frase-sobre {
  margin: 4px 0 0;
  max-width: 30ch;
  font-family: var(--serif);
  font-style: italic;
  font-size: 21px;
  line-height: 1.4;
  color: var(--vino);
  text-wrap: balance;
}

/* ---------- Papel (carta y mensaje final) ---------- */
.papel {
  position: relative;
  background: var(--papel);
  border-radius: 4px;
  padding: 64px 26px 36px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 28px 50px -34px rgba(62, 10, 32, .55);
}
.papel::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid var(--linea);
  pointer-events: none;
}
.ramita { position: absolute; width: 86px; height: 43px; color: var(--rosa); }
.ramita-sup { top: 16px; right: 16px; }
.saludo { font-size: 44px; margin-bottom: 14px; }
.parrafo { font-family: var(--serif); font-size: 19px; line-height: 1.6; margin: 0 0 14px; color: var(--tinta); text-wrap: pretty; }
.parrafo:last-child { margin-bottom: 0; }

.revela { opacity: 0; transform: translateY(10px); }
.escena.mostrada .revela {
  opacity: 1;
  transform: none;
  transition: opacity 1s var(--ease), transform 1s var(--ease);
  transition-delay: var(--d, 0s);
}
.escena.sin-espera .revela { transition-delay: 0s !important; transition-duration: .2s; }

/* ---------- Escena 03: razones ---------- */
.progreso {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 16px;
  align-items: center;
}
.progreso-cifra {
  grid-row: 1 / 3;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 44px;
  line-height: 1;
  color: var(--vino);
  font-variant-numeric: lining-nums tabular-nums;
}
.progreso-total { font-size: 20px; color: var(--rosa); margin-left: 2px; }
.progreso-barra { height: 4px; border-radius: 999px; background: rgba(231, 170, 183, .5); overflow: hidden; }
.progreso-relleno {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--rosa), var(--frambuesa));
  transition: width .8s var(--ease);
}
.progreso-texto { margin: 6px 0 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-suave); }

.rejilla {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
@media (min-width: 640px) { .rejilla { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; } }
.rejilla li { min-width: 0; perspective: 700px; }
.rejilla li.ultima { grid-column: 1 / -1; }

.tarjeta {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  padding: 0;
  border: 1px solid var(--linea);
  border-radius: 10px;
  background: var(--papel);
  color: var(--vino);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 12px 20px -18px rgba(62, 10, 32, .6);
  transition: transform .35s var(--ease), box-shadow .35s, background .5s, color .5s, border-color .5s;
  touch-action: manipulation;
}
.tarjeta::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 7px;
  border: 1px dashed rgba(219, 129, 146, .35);
  pointer-events: none;
}
.tarjeta.tono-b { background: linear-gradient(170deg, #F7EDEE, var(--papel)); }
.tarjeta.tono-c { background: linear-gradient(170deg, var(--papel), #EFE6DE); }
.tarjeta:hover { transform: translateY(-3px); box-shadow: 0 16px 24px -16px rgba(62, 10, 32, .55); }
.tarjeta:active { transform: scale(.96); }
.tarjeta:focus-visible { outline: 2px solid var(--frambuesa); outline-offset: 3px; }
.tarjeta .num {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(24px, 7vw, 30px);
  line-height: 1;
  font-variant-numeric: lining-nums;
}
.tarjeta .motivo { width: 18px; height: 18px; color: var(--rosa); transition: color .5s; }
.tarjeta .marca {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--rosa-suave);
  opacity: 0;
  transition: opacity .5s;
}
.tarjeta.descubierta {
  background: linear-gradient(165deg, var(--vino-medio), var(--vino) 55%, var(--vino-profundo));
  color: var(--marfil);
  border-color: var(--vino);
}
.tarjeta.descubierta::before { border-color: rgba(231, 170, 183, .35); }
.tarjeta.descubierta .num { color: var(--rosa-suave); }
.tarjeta.descubierta .motivo { color: var(--marfil); }
.tarjeta.descubierta .marca { opacity: 1; }
.tarjeta.girando { animation: girar .7s var(--ease); }
@keyframes girar { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg) scale(.96); } 100% { transform: rotateY(0); } }

/* Tarjeta 29: pieza final, a todo el ancho */
.ultima .tarjeta {
  aspect-ratio: auto;
  min-height: 84px;
  flex-direction: row;
  gap: 14px;
  padding: 16px 20px;
  background: linear-gradient(100deg, var(--papel), #F5E4E8);
  border-color: var(--rosa);
}
.ultima .tarjeta .num { font-size: 38px; }
.ultima .tarjeta .etiqueta {
  font-family: var(--mano);
  font-size: 30px;
  line-height: 1;
  color: var(--frambuesa);
  transition: color .5s;
}
.ultima .tarjeta .motivo { width: 22px; height: 22px; }
.ultima .tarjeta.descubierta { background: linear-gradient(100deg, var(--vino-profundo), var(--vino) 50%, var(--vino-medio)); }
.ultima .tarjeta.descubierta .etiqueta { color: var(--rosa-suave); }

.mensaje-completo {
  margin: 0;
  text-align: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 21px;
  line-height: 1.4;
  color: var(--vino);
  animation: entrar .9s var(--ease) both;
}

/* ---------- Visor ---------- */
.visor {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px));
}
.visor-velo {
  position: absolute;
  inset: 0;
  background: rgba(62, 10, 32, .5);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: aparecer .35s var(--ease) both;
}
@keyframes aparecer { from { opacity: 0; } }
.visor-tarjeta {
  position: relative;
  width: min(400px, 100%);
  max-height: 100%;
  overflow-y: auto;
  padding: 40px 26px 22px;
  border-radius: 6px;
  background: var(--papel);
  text-align: center;
  box-shadow: 0 40px 70px -30px rgba(30, 4, 14, .7);
  animation: voltear .6s var(--ease) both;
  outline: none;
}
.visor-tarjeta::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid var(--linea);
  pointer-events: none;
}
.visor-tarjeta.cambio { animation: voltear .5s var(--ease) both; }
@keyframes voltear {
  from { opacity: 0; transform: perspective(900px) rotateY(-70deg) scale(.92); }
  to { opacity: 1; transform: none; }
}
.visor-x {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--vino);
  display: grid;
  place-items: center;
  z-index: 1;
}
.visor-x:focus-visible { outline: 2px solid var(--frambuesa); }
.visor-numero {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 64px;
  line-height: 1;
  color: var(--frambuesa);
  font-variant-numeric: lining-nums;
}
.visor-motivo { width: 34px; height: 34px; margin: 10px auto 0; display: block; color: var(--rosa); }
.visor-titulo {
  margin: 14px 0 10px;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 27px;
  line-height: 1.15;
  color: var(--vino);
  text-wrap: balance;
}
.visor-texto { margin: 0 auto 24px; max-width: 32ch; font-size: 16px; line-height: 1.65; color: var(--tinta); text-wrap: pretty; }
.visor-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }
.visor-pos { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.btn-redondo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid var(--rosa);
  background: transparent;
  color: var(--vino);
  display: grid;
  place-items: center;
  padding: 0;
  transition: background .3s, transform .2s;
}
.btn-redondo:hover { background: rgba(231, 170, 183, .3); }
.btn-redondo:active { transform: scale(.94); }
.btn-redondo:focus-visible { outline: 2px solid var(--frambuesa); outline-offset: 2px; }

/* ---------- Escena 04: pastel ---------- */
.pastel-wrap { width: min(330px, 86vw); max-width: 100%; }
.pastel { width: 100%; height: auto; display: block; overflow: visible; }
.llama { opacity: 0; transform: scale(.2); transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .4s var(--ease), transform .5s var(--ease); }
.llama.encendida { opacity: 1; transform: scale(1); }
.llama.encendida .llama-forma { animation: parpadeo 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.halo { opacity: 0; transition: opacity .8s var(--ease); }
.halo.encendido { opacity: 1; }
@keyframes parpadeo {
  0%, 100% { transform: scale(1, 1) skewX(0); }
  30% { transform: scale(.94, 1.06) skewX(2deg); }
  60% { transform: scale(1.04, .95) skewX(-2deg); }
}
.mensaje-deseo {
  margin: 0;
  max-width: 30ch;
  min-height: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 21px;
  line-height: 1.45;
  color: var(--vino);
  text-wrap: balance;
}
.mensaje-deseo:empty { display: none; }
.mensaje-deseo.visible { animation: entrar 1.1s var(--ease) both; }

/* ---------- Escena 05: final ---------- */
.papel-final { text-align: center; padding-top: 60px; }
.papel-final .ramita-sup { right: 50%; margin-right: -43px; }
.papel-final .parrafo { font-size: 20px; }
.felicidades { font-size: clamp(38px, 11vw, 58px); margin-top: 18px; white-space: nowrap; }
.firma {
  margin: 10px 0 0;
  font-size: 12px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--vino);
}

/* ---------- Partículas ---------- */
.particulas { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
.petalo {
  position: absolute;
  top: -24px;
  width: 11px;
  height: 15px;
  border-radius: 80% 0 80% 0;
  opacity: .9;
  animation: caer var(--dur, 4s) linear forwards;
  will-change: transform;
}
@keyframes caer {
  to { transform: translate3d(var(--dx, 0px), 110vh, 0) rotate(var(--rot, 540deg)); opacity: .2; }
}
.corazon {
  position: absolute;
  bottom: -30px;
  width: var(--t, 16px);
  height: var(--t, 16px);
  opacity: 0;
  animation: flotar var(--dur, 9s) ease-in forwards;
  will-change: transform;
}
@keyframes flotar {
  0% { transform: translate3d(0, 0, 0) scale(.6); opacity: 0; }
  12% { opacity: .7; }
  100% { transform: translate3d(var(--dx, 20px), -105vh, 0) scale(1); opacity: 0; }
}

/* ---------- Aviso ---------- */
.aviso {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  z-index: 60;
  transform: translate(-50%, 20px);
  max-width: calc(100% - 32px);
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--vino);
  color: var(--marfil);
  font-size: 13px;
  letter-spacing: .04em;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s, transform .35s var(--ease);
}
.aviso.visible { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Pantallas grandes y bajas ---------- */
@media (min-width: 640px) {
  .papel { padding: 56px 52px 44px; }
  .parrafo { font-size: 21px; }
  .papel-final .parrafo { font-size: 22px; }
}
@media (max-height: 700px) {
  .nombre-portada { font-size: 58px; }
  .sobre { width: min(250px, 70vw); margin-top: 18px; }
  .contenido { gap: 18px; }
  .frase-sobre { font-size: 19px; }
}

/* ---------- Movimiento reducido ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    transition-delay: 0s !important;
  }
  .particulas { display: none; }
}

</style>

/*

window.Musica = (function () {

      var g = el("g", {}, svg);
      var alto = 24;
      el("rect", { x: v.x - 2.1, y: v.y - alto, width: 4.2, height: alto, rx: 1.2, fill: colores[v.i % 3], stroke: "#79113A", "stroke-opacity": ".25", "stroke-width": .5 }, g);
      el("line", { x1: v.x, y1: v.y - alto, x2: v.x, y2: v.y - alto - 3, stroke: "#3E0A20", "stroke-width": .8, "stroke-linecap": "round" }, g);
      var ll = el("g", { "class": "llama" }, g);
      el("circle", { cx: v.x, cy: v.y - alto - 7, r: 6, fill: "#F6D58E", opacity: ".35" }, ll);
      el("path", {
        "class": "llama-forma",
        d: "M" + v.x + " " + (v.y - alto - 2.5) + " c-2.6 0 -3.4 -2.6 -2.2 -4.8 c0.9 -1.7 2.2 -3 2.2 -5.4 c1.6 1.6 3.4 3.6 3.2 6 c-0.1 2.3 -1.2 4.2 -3.2 4.2 z",
        fill: "url(#g-llama)"
      }, ll);
      porIndice[v.i] = ll;
    });
    llamas = porIndice;
  }

  var encendiendo = false;
  function encenderVelas() {
    if (encendiendo || estado.velas) return;
    encendiendo = true;
    $("btn-velas").disabled = true;
    Musica.campanita && Musica.campanita();
    llamas.forEach(function (ll, i) {
      setTimeout(function () { ll.classList.add("encendida"); }, esperar(400 + i * 85));
    });
    setTimeout(function () { $("halo").classList.add("encendido"); }, esperar(600));
    setTimeout(function () {
      encendiendo = false;
      estado.velas = true;
      guardar();
      mostrarDeseo(true);
    }, esperar(400 + llamas.length * 85 + 300));
  }
  function mostrarDeseo(celebrar) {
    var m = $("mensaje-deseo");
    m.textContent = D.pastel.mensaje;
    m.classList.add("visible");
    $("btn-velas").hidden = true;
    $("btn-final").hidden = false;
    if (celebrar) {
      lluviaPetalos(46);
      $("btn-final").focus({ preventScroll: true });
    }
  }
  function velasYaEncendidas() {
    llamas.forEach(function (ll) { ll.classList.add("encendida"); });
    $("halo").classList.add("encendido");
    mostrarDeseo(false);
  }

  /* ---------- Partículas ---------- */
  function lluviaPetalos(n) {
    if (reducido) return;
    var capa = $("particulas");
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "petalo";
      s.style.left = (Math.random() * 100) + "%";
      s.style.background = COLORES[i % COLORES.length];
      s.style.animationDelay = (Math.random() * 1.4) + "s";
      s.style.setProperty("--dur", (3.4 + Math.random() * 2.6) + "s");
      s.style.setProperty("--dx", (Math.random() * 140 - 70) + "px");
      s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      s.style.transform = "scale(" + (0.6 + Math.random() * 0.7) + ")";
      capa.appendChild(s);
      s.addEventListener("animationend", function () { this.remove(); });
    }
  }

  var corazonesT = null;
  var corazonesFin = 0;
  function unCorazon() {
    var capa = $("particulas");
    var c = document.createElement("span");
    c.className = "corazon";
    c.innerHTML = CORAZON_SVG;
    c.style.left = (5 + Math.random() * 90) + "%";
    c.style.color = COLORES[1 + Math.floor(Math.random() * 3)];
    c.style.setProperty("--t", (12 + Math.random() * 14) + "px");
    c.style.setProperty("--dur", (7 + Math.random() * 5) + "s");
    c.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    capa.appendChild(c);
    c.addEventListener("animationend", function () { c.remove(); });
  }
  function iniciarCorazones() {
    if (reducido) return;
    detenerCorazones();
    corazonesFin = Date.now() + 16000;
    var ritmo = function () {
      if (Date.now() > corazonesFin) { corazonesT = null; return; }
      unCorazon();
      corazonesT = setTimeout(ritmo, 650 + Math.random() * 600);
    };
    corazonesT = setTimeout(ritmo, 1800);
  }
  function detenerCorazones() {
    clearTimeout(corazonesT);
    corazonesT = null;
  }

  /* ---------- Música ---------- */
  function alternarMusica() {
    var b = $("btn-musica");
    var antes = Musica.estaSonando();
    var sonando = !!Musica.alternar();
    if (!antes && !sonando) {
      avisar("Este navegador no permite reproducir la música");
      return;
    }
    b.setAttribute("aria-pressed", sonando ? "true" : "false");
    b.setAttribute("aria-label", sonando ? "Silenciar música" : "Reproducir música");
    avisar(sonando ? "Música activada" : "Música en pausa");
  }

  /* ---------- Arranque ---------- */
  function iniciar() {
    cargar();
    poblarTextos();
    construirPuntos();
    construirTarjetas();
    construirPastel();
    if (estado.velas) velasYaEncendidas();

    $("sobre").addEventListener("click", abrirSobre);
    $("btn-abrir").addEventListener("click", abrirSobre);
    $("btn-volver").addEventListener("click", function () { irA(estado.actual - 1); });
    $("btn-musica").addEventListener("click", alternarMusica);
    $("btn-velas").addEventListener("click", encenderVelas);
    $("btn-reiniciar").addEventListener("click", function () { irA(0); });
    $("carta").addEventListener("click", function () { escenas[1].classList.add("sin-espera"); });
    $("carta-final").addEventListener("click", function () { escenas[4].classList.add("sin-espera"); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-ir]"), function (b) {
      b.addEventListener("click", function () { irA(parseInt(b.getAttribute("data-ir"), 10)); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-cerrar]"), function (b) {
      b.addEventListener("click", cerrarVisor);
    });
    $("visor-prev").addEventListener("click", function () { moverVisor(-1); });
    $("visor-next").addEventListener("click", function () { moverVisor(1); });

    escenas[0].classList.add("mostrada");
    // Enlace directo a una escena (#parte-1 … #parte-5), útil para revisar o capturar.
    var m = /^#parte-([1-5])$/.exec(location.hash);
    if (m && m[1] !== "1") {
      var destino = parseInt(m[1], 10) - 1;
      estado.maxVisitada = Math.max(estado.maxVisitada, destino);
      reducido = true;
      irA(destino);
      setTimeout(function () { reducido = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }, 200);
    }
    // Para pruebas automatizadas y depuración
    window.__experiencia = { irA: irA, estado: estado };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();

</script>
</body>
</html>
